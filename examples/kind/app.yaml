# Minimal app for the kind end-to-end test in CI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
  namespace: shop
data:
  GREETING: hello-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: shop
spec:
  replicas: 2
  selector: {matchLabels: {app: demo}}
  template:
    metadata: {labels: {app: demo}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: demo
          image: busybox:1.36
          command: ["sh", "-c", "echo $GREETING; sleep 3600"]
          envFrom: [{configMapRef: {name: demo-config}}]
          readinessProbe: {exec: {command: ["true"]}}
